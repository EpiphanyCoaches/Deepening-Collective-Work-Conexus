f looking ahead, staying curious about what's on the horizon while balancing growing expectations from our members, employees, and Board with the demands on our teams.\u003cbreak time=\"0.5s\"/>These are important reminders of what the organization needs from us as we continue moving forward together.\u003c/prosody>\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"In our last workshop,","startTime":0.079,"finishTime":1.509},{"text":"we reflected on what the organization needs most from us as leaders.","startTime":1.669,"finishTime":5.679},{"text":"We talked about the importance of building on our momentum,","startTime":6.599,"finishTime":9.699},{"text":"recognizing our strong business results,","startTime":9.88,"finishTime":12.47},{"text":"positive employee feedback,","startTime":12.84,"finishTime":14.5},{"text":"and the progress we've made in rolling out our strategy and new brand.","startTime":14.8,"finishTime":18.299},{"text":"We also discussed the need to create clarity and focus,","startTime":19.45,"finishTime":22.719},{"text":"aligning on priorities,","startTime":22.899,"finishTime":24.6},{"text":"defining clear processes,","startTime":24.899,"finishTime":26.579},{"text":"and providing stability as we continue through integration.","startTime":26.819,"finishTime":30.159},{"text":"Another important theme was strengthening connection,","startTime":31.02,"finishTime":33.979},{"text":"working together as one leadership team,","startTime":34.34,"finishTime":36.84},{"text":"supporting each other","startTime":37.299,"finishTime":38.279},{"text":"and sharing in both our successes and challenges.","startTime":38.38,"finishTime":41.18},{"text":"And finally,","startTime":42.069,"finishTime":42.99},{"text":"we talked about the importance of looking ahead,","startTime":43.229,"finishTime":45.639},{"text":"staying curious about what's on the horizon","startTime":46.069,"finishTime":48.27},{"text":"while balancing growing expecta ey're experiencing and what challenges they may be facing. Who do you need to get input from? How can you do that?\n\nSecond, ask the right questions. Try asking, “What's emerging that we should be paying attention to?” or “What am I not seeing from your perspective?” These questions can help uncover insights we might otherwise miss.\n\nThird, look for patterns. Pay attention to recurring concerns, shifts in energy, or challenges that appear across multiple teams. These can be early signals of broader organizational issues.\n\nAnd finally, share what you're learning. Bring important observations back to the ELT to build shared understanding and identify opportunities to take action together.\n\nRemember, micro-listening loops give you more insight and information. We can't know it all so we have to get regular feedback from the system.","voiceCode":"en-US-AlloyTurboMultilingualNeural","language":"en","originalResourceId":"PfbFsaTDiJwrYGXh2","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-AlloyTurboMultilingualNeural\">Here is one new practical way to sense the system called micro-listening loops. These are small, regular opportunities to listen and better understand what's happening across Conexus.\u003cbreak time=\"0.5s\"/>First, check in regularly. Connect with people across different teams and levels to understand what they're experiencing and what challenges they may be facing. Who do you need to get input from? How can you do that?\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>Second, ask the right questions. Try asking, “What's emerging that we should be paying attention to?” or “What am I not seeing from your perspective?” These questions can help uncover insights we hat?\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Second, ask the right questions. Try asking, “What's emerging that we should be paying attention to?” or “What am I not seeing from your perspective?” These questions can help uncover insights we might otherwise miss.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Third, look for patterns. Pay attention to recurring concerns, shifts in energy, or challenges that appear across multiple teams. These can be early signals of broader organizational issues.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"And finally, share what you're learning. Bring important observations back to the ELT to build shared understanding and identify opportunities to take action together.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Remember, micro-listening loops give you more insight and information. We can't know it all so we have to get regular feedback from the system.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Here is one new practical way to sense the system called micro-listening loops. These are small, regular opportunities to listen and better understand what's happening across Conexus.\n\nFirst, check in regularly. Connect with people across different teams and levels to understand what they're experiencing and what challenges they may be facing. Who do you need to get input from? How can you do that?\n\nSecond, ask the right questions. Try asking, “What's emerging that we should be paying attention to?” or “What am I not seeing from your perspective?” These questions can help uncover insights we might otherwise miss.\n\nThird, look for patterns. Pay attention to recurring concerns, shifts in energy, or challenges that appear across multiple teams. These can be early signals of broader organizational issues.\n\nAnd finally, share what you're learning. Bring important observations back to the ELT to build shared understanding and identify opportunities to take action together.\n\nRemember, micro-listening loops give you more insight and information. We can't know it all so we have to get regular feedback from the system.","featureAdoption":{"isAddingPauses":true,"isUsingMultipleVoices":false,"isAdjustingSpeed":false},"jobId":"eowdPETdvBLGreR5W","voiceCodeUsed":"en-US-AlloyTurboMultilingualNeural"}},"ZeooPrSfTbvHQCJn3":{"_id":"ZeooPrSfTbvHQCJn3","data":{"attributes":{"title":"Introduction to Communication Planning","template":"resourceSlide","locale":"en","upload":"8PtTQdX2fav6ezCsK"},"video":{"autoPlay":true,"overlays":[{"identifier":"pBH9Gks47vvLQrprH","kind":"group","overlays":[{"customStyle":{"fill":{"opacity":50,"color":"koantic(accent2, 0, 1)","type":"color"},"border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fontColor":"koantic(light1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20},"isCircle":true},"y":560,"x":1122,"identifier":"eqY8RKHuuSeB74rFP","width":6,"height":6,"rotationAngle":0,"kind":"overlay","type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"isRatioFixed":true,"start":0,"behaviorType":"continue"},{"customStyle":{"fill":{"opacity":50,"color":"koantic(accent2, 0, 1)","type":"color"},"border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"isCircle":true,"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"botto e\":\"\",\"text\":\"As an ELT, you identified the importance of evaluating risks, exploring possible solutions, understanding stakeholder impacts, and capturing different perspectives, even when there isn't complete agreement.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Ultimately, sensing the system helps the ELT identify these dynamics earlier, build shared understanding, and strengthen how leaders partner and make decisions together.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}}],\"direction\":\"ltr\",\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"We know how important it is to lead at the enterprise level, and a key part of doing this is learning to sense the system.\n\nSensing the system is about getting input and feedback from people and our environment to support our decisions and actions, all along the way.\n\nIn our last workshop, we explored this concept through the Cultivator program. The purpose wasn't necessarily to resolve Cultivator itself, but to recognize some broader patterns in how the ELT works.\n\nWe discussed how certain issues can surface, go quiet, and then re-emerge unexpectedly, sometimes too close to a Board meeting for meaningful discussion.\n\nWe also talked about the importance of thinking beyond individual portfolios. Even when an issue falls within one function, its impacts can extend across the entire organization.\n\nAs an ELT, you identified the importance of evaluating risks, exploring possible solutions, understanding stakeholder impacts, and capturing different perspectives, even when there isn't complete agreement.\n\nUltimately, sensing the system helps the ELT identify these dynamics earlier, build shared understanding, and strengthen how leaders partner and make decisions together.","jobId":"fTcZpXa3ZFcLF7sqn","featureAdoption":{"isAddingPauses":false,"isUsingMultipleVoices":false,"isAdjustingSpeed":false},"voiceCodeUsed":"en-US-AlloyTurboMultilingualNeural"}},"eedARMTwXcaLXhGRL":{"_id":"eedARMTwXcaLXhGRL","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"CK5SYYbkgaLixzYAM"},"dates":{"dateCreated":"2026-10-21T14:44:39.644Z","dateModified":"2026-10-28T16:28:52.102Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"},"assessment":{"graded":false,"showFeedback":true,"questions":["GPDuY69bRvYS3Mfka"]},"video":{"autoPlay":true,"overlays":[{"identifier":"WzL6WaRs3DPdWGt4S","kind":"overlay","type":"questionSurveyFreeText","width":1152,"height":511,"x":61,"y":111,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"left","border":{"color":"koantic(dark2, 0, 1)","size":4,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(light1, 0, 1)"},"fontColor":"koantic(accent1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":true,"italic":false,"underline":false,"size":20},"shadow":{"angle":270,"distance":0,"blur":12,"color":"rgba(0, 0, 0, 0.53)"},"textStylePreset":"normal","textHeading":"normal"},"questionId":"GPDuY69bRvYS3Mfka","start":0,"behaviorType":"continue","rotationAngle":0},{"identifier":" br />\nRecognize when something is an &ldquo;ours,&rdquo; not a &ldquo;mine.&rdquo; Name it openly rather than making decisions in isolation.\u003c/div>\n\n\u003cdiv>&nbsp;\u003c/div>\n\n\u003cdiv>\u003cspan style=\"color:#703dd6\">\u003cstrong>2. Bring a Draft\u003c/strong>\u003c/span>\u003cbr />\nInvite input early by bringing ideas for discussion, not finished decisions for approval. Balance collaboration with ownership.\u003c/div>\n\n\u003cdiv>&nbsp;\u003c/div>\n\n\u003cdiv>\u003cspan style=\"color:#703dd6\">\u003cstrong>3. Ask Directly\u003c/strong>\u003c/span>\u003cbr />\nAsk, &ldquo;What am I not seeing from your perspective?&rdquo; Remember, no single leader has a complete view of the organization.\u003c/div>\n\n\u003cdiv>&nbsp;\u003c/div>\n\n\u003cdiv>\u003cspan style=\"color:#703dd6\">\u003cstrong>4. Agree on Timing\u003c/strong>\u003c/span>\u003cbr />\nAllow realistic time for meaningful input and collaboration before decisions or approvals are needed.\u003c/div>\n\n\u003cdiv>&nbsp;\u003c/div>\n\n\u003cdiv>\u003cstrong>Remember:\u003c/strong> Friction often arises when we see something as &ldquo;mine&rdquo; while others see it as &ldquo;ours.&rdquo; Shifting to a collective mindset helps us build stronger partnerships.\u003c/div>\n\u003c/div>\n\n\u003cdiv>&nbsp;\u003c/div>\n","identifier":"fpmk9F8FJPck5r3BL","kind":"overlay","type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"start":0,"behaviorType":"continue","rotationAngle":0},{"identifier":"DakY8RRH2RrwDsMq7","kind":"group","overlays":[{"isDecorative":true,"identifier":"39DAD2mmeLKv3o7CC","width":370.22959375915804,"height":370.68702290076334,"x":922.7246047141243,"y":361.26717557251914,"customStyle":{"border":{"color":"koantic(accent1, 0, 1)","size":1,"left":true,"top":true,"bottom":true,"right":true},"fontColor":"koantic(dark1, 0, 1)","roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"verticalAlignment":"m healthy habits. Deepening collective work means shifting from an “I” mindset to a “we” mindset. There are four healthy partnership habits that can help support this shift. Name It. Bring a Draft. Ask Directly. and Agree on Timing.\n\nIn our last session, we explored these habits together and identified two important takeaways.\n\nThe first was framing challenges with a “we” mindset rather than an “I” mindset—recognizing that decisions and actions often impact the ELT as a whole, making it important to approach them with shared ownership and collaboration.\n\nThe second was recognizing different working styles. People approach decisions and collaboration differently, which is why staging conversations and allowing enough lead time for meaningful input are so important.\n\nKeeping these two ideas in mind can help the ELT strengthen collaboration, reduce friction, and work more effectively together.","jobId":"unjWwAPbAo79vLnd6","featureAdoption":{"isAdjustingSpeed":false,"isAddingPauses":false,"isUsingMultipleVoices":false},"voiceCodeUsed":"en-US-AlloyTurboMultilingualNeural"}},"vkWT7MuPGD7ieu24z":{"_id":"vkWT7MuPGD7ieu24z","data":{"attributes":{"title":"Know–Feel–Believe–Do Framework","template":"resourceSlide","locale":"en","upload":"nXEgwXnvkvJJhZoWq"},"video":{"autoPlay":true,"overlays":[{"width":974,"y":17,"customStyle":{"font":{"size":25,"bold":true,"underline":false,"italic":false},"textHeading":"heading1","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"right":true,"top":true,"bottom":true},"lineHeight":1.2,"fill":{"color":"koantic(light1, 0, 0)","type":"color"},"fontColor":"koantic(accent1, 0, 1)","textAlignment":"left","type":"rectangle","padding":{"top":0,"bottom":0,"left":0,"right":0},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"verticalAlignment":"middle"},"htmlContent":"\u003cdiv>Pace, Timing, and Capacity\u003c/div>\n","height":91,"identifier":"GeK9TP7tmdXZFxPXf","x":53,"type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"start":0,"behaviorType":"continue","kind":"overlay","rotationAngle":0},{"customStyle":{"verticalAlignment":"top","lineHeight":1.3,"textAlignment":"left","fill":{"color":"koantic(light1, 0, 0)","type":"color"},"fontColor":"rgb(59, 59, 59)","font":{"size":14,"bold":false,"italic":false,"underline":false},"type":"rectangle","border":{"top":true,"right":true,"bottom":true,"left":true,"color":"koantic(dark1, 0, 1)","size":0},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"padding":{"top":0,"right":0,"bottom":0,"left":0}},"height":570,"width":825,"x":41,"y":225,"htmlContent":"\u003cdiv>\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>\n\t\u003cdiv>\n\t\u003cdiv>\u003cspan style=\"color:#703dd6\">\u003cstrong>Managing Execution:\u003c/strong>\u003c/span> Aligning on decisions isn&#39;t the challenge. It&#39;s managing the pace and sequencing of initiatives that often compete for the same resources.\u003cbr />\n\t&nbsp;\u003c/div>\n\t\u003c/div>\n\t\u003c/div>\n\t\u003c/li>\n\t\u003cli>\n\t\u003cdiv>\n\t\u003cdiv>\n\t\u003cdiv>\u003cspan style=\"color:#703dd6\">\u003cstrong>Enterprise Capacity:\u003c/strong>\u003c/span> The ELT has a unique responsibility to understand capacity across the organization and make intentional choices about priorities and trade-offs.\u003cbr />\n\t&nbsp;\u003c/div>\n\t\u003c/div>\n\t\u003c/div>\n\t\u003c/li>\n\t\u003cli>\n\t\u003cdiv>\n\t\u003cdiv>\n\t\u003cdiv>\u003cspan style=\"color:#703dd6\">\u003cstrong>Balancing Ambition and Wellbeing:\u003c/strong>\u003c/span> Our pace creates energy and momentum, but also puts pressure on our people and can lead to diminishing returns.\u003cbr />\n\t&nbsp;\u003c/div>\n\t\u003c/div>\n\t\u003c/div>\n\t\u003c/li>\n\t\u003cli>\n\t\u003cdiv>\n\t\u003cdiv>\n\t\u003cdiv>\u003cspan style=\"color:#703dd6\">\u003cstrong>Looking Beyond Headcount:\u003c/strong>\u003c/span> Capacity challenges require an enterprise-wide perspective. Are they driven by staffing, inefficient systems, or repeated reinvention?\u003cbr />\n\t&nbsp;\u003c/div>\n\t\u003c/div>\n\t\u003c/div>\n\t\u003c/li>\n\t\u003cli>\n\t\u003cdiv>\n\t\u003cdiv>\n\t\u003cdiv>\u003cspan style=\"color:#703dd6\">\u003cstrong>Recognizing the Double Load: \u003c/strong>\u003c/span>Integration means running the business while bringing organizations together, limiting our capacity to take on additional major initiatives.\u003c/div>\n\t\u003c/div>\n\t\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv>&nbsp;\u003c/div>\n\n\u003cdiv>\u003cstrong>The Goal: \u003c/strong>Find the right balance between maintaining momentum and creating the capacity to deliver effectively and sustainably.\u003c/div>\n\u003c/div>\n\n\u003cdiv>&nbsp;\u003c/div>\n","identifier":"fpmk9F8FJPck5r3BL","kind":"overlay","type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"start":0,"behaviorType":"continue","rotationAngle":0},{"identifier":"DakY8RRH2RrwDsMq7","kind":"group","overlays":[{"isDecorative":true,"identifier":"39DAD2mmeLKv3o7CC","width":370.22959375915804,"height":370.68702290076334,"x":922.7246047141243,"y":361.26717557251914,"customStyle":{"border":{"color":"koantic(accent1, 0, 1)","size":1,"left":true,"top":true,"bottom":true,"right":true},"fontColor":"koantic(dark1, 0, 1)","roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"verticalAlignment":"middle","lineHeight":1.2,"textAlignment":"center","font":{"size":20,"bold":false,"italic":false,"underline":false},"type":"rectangle","fill":{"type":"color","color":"koantic(light1, 0, 0)"},"padding":{"left":0,"top":0,"bottom":0,"right":0}},"isImage":true,"imageAsset":"K2w7hQ3RFp8KRAkzH","isRatioFixed":true,"type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"start":0,"behaviorType":"continue","kind":"overlay","rotationAng
